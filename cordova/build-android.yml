name: Build 元幻 Android APK

# 无需本地安装 Android SDK：GitHub 云端构建
# 用法：Actions → 选择本工作流 → Run workflow，构建完成后在 Artifacts 下载 APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Android SDK（云端，不占本地空间）
        uses: android-actions/setup-android@v3

      - name: 接受 Android 许可
        run: yes | sdkmanager --licenses || true

      - name: 安装 Cordova CLI
        run: npm install -g cordova

      - name: 添加安卓平台
        run: cordova platform add android

      - name: 构建 Debug APK
        run: cordova build android

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 元幻-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
